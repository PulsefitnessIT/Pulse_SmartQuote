name: SmartQuote V10 Python tests

on:
  push:
    branches: [ "develop/v10" ]
  pull_request:
    branches: [ "main", "develop/v10" ]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip show fastapi starlette httpx
      - name: Compile source
        run: python -m compileall -q .
      - name: Test the historic importer without customer files
        run: python -m unittest tests/test_v10_historical_master.py -v
      - name: Run existing application regressions
        env:
          SMARTQUOTE_AUTH: "off"
        run: python -m unittest discover -s tests -v
