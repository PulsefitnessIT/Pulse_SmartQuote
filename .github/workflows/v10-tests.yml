name: SmartQuote V10 Python tests

on:
  push:
    branches: [ "develop/v10" ]
  pull_request:
    branches: [ "main", "develop/v10" ]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip show fastapi starlette httpx
      - name: Compile Python source and check UI script
        run: |
          python -m compileall -q .
          node --check static/app.js
      - name: Test the historic importer without customer files
        run: python -m unittest tests/test_v10_historical_master.py -v
      - name: Run existing and V10 application regressions
        env:
          SMARTQUOTE_AUTH: "off"
        run: python -m unittest discover -s tests -v
      - name: Build verified, data-safe internal pilot archive
        if: github.event_name != 'pull_request'
        run: |
          python build_v10_pilot.py --output dist/Pulse_Fitness_SmartQuote_V10_Internal_Pilot.zip
      - name: Upload controlled internal pilot (not customer release)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-SmartQuote-V10-Internal-Pilot
          path: dist/Pulse_Fitness_SmartQuote_V10_Internal_Pilot.zip
          retention-days: 14

  windows_download_smoke:
    name: Extract ZIP and start on Windows
    needs: regression
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build release ZIP and test actual Windows download
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'Pulse Fitness SmartQuote V10 Download.zip'
          python build_v10_pilot.py --output $download
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the full download ZIP' }
          $extracted = Join-Path $env:RUNNER_TEMP 'SmartQuote Folder With Spaces'
          Expand-Archive -LiteralPath $download -DestinationPath $extracted -Force
          Set-Location (Join-Path $extracted 'SmartQuote_V10')
          if (-not (Test-Path 'requirements.txt')) { throw 'Missing packaged requirements.txt' }
          if (-not (Test-Path 'startup_manager.py')) { throw 'Missing packaged startup helper' }
          & cmd.exe /c 'start_windows.bat --check'
          if ($LASTEXITCODE -ne 0) { throw 'Windows first-run bootstrap failed' }
          & cmd.exe /c 'start_windows.bat --check'
          if ($LASTEXITCODE -ne 0) { throw 'Windows cached second-run startup failed' }
      - name: HTTP health check from extracted Windows package
        shell: pwsh
        env:
          SMARTQUOTE_AUTH: 'off'
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:RUNNER_TEMP 'SmartQuote Folder With Spaces\SmartQuote_V10'
          Set-Location $base
          $python = Join-Path $base '.venv\Scripts\python.exe'
          $server = Start-Process -FilePath $python -ArgumentList @('-m','uvicorn','main:app','--host','127.0.0.1','--port','8765') -PassThru
          try {
            $healthy = $false
            for ($try = 0; $try -lt 60; $try++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/health' -TimeoutSec 2
                if ($response.ok -and $response.name -eq 'Pulse Fitness SmartQuote') { $healthy = $true; break }
              } catch { }
            }
            if (-not $healthy) { throw 'Extracted application failed HTTP /api/health' }
            Write-Host 'Extracted Windows startup/health check passed.'
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
